command:
  - sh
  - -c
  - |
    cd frontend && npm install && npm run build
    uvicorn src.main:app --host 0.0.0.0 --port 8000

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: UC_CATALOG
    value: "plataforma"
  - name: UC_SCHEMA
    value: "default"
  # Opcional: se precisar usar token explicitamente (não recomendado em Apps)
  # - name: DATABRICKS_TOKEN
  #   valueFrom: secret-scope/databricks-token
  # Se precisar de Service Principal para acesso externo (ex: chamar APIs)
  # - name: SERVICE_PRINCIPAL_CLIENT_ID
  #   valueFrom: sp-client-id
  # - name: SERVICE_PRINCIPAL_CLIENT_SECRET
  #   valueFrom: sp-client-secret