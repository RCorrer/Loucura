command:
  - uvicorn
  - src.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: UC_CATALOG
    value: "plataforma"
  - name: UC_SCHEMA
    value: "default"
  # (Opcional) Se precisar de token explícito para autenticação externa:
  # - name: DATABRICKS_TOKEN
  #   valueFrom: secret-scope/databricks-token